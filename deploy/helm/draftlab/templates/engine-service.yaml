apiVersion: v1
kind: Service
metadata:
  name: {{ include "draftlab.fullname" . }}-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "draftlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  selector:
    {{- include "draftlab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: engine
  ports:
    - name: http
      port: {{ .Values.engine.port }}
      targetPort: http
