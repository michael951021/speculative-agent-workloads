# Prometheus for the speculative-agent-workloads gateway (see gateway/). Local/dev scrape target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: speculative-agent-workloads-gateway
    static_configs:
      - targets: ["127.0.0.1:8200"]
