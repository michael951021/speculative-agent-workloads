{{- if .Values.observability.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar / provisioning (label grafana_dashboard).
# Keep in sync with deploy/grafana/draftlab.json (checked in tools/check.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "draftlab.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "draftlab.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  draftlab.json: |-
{{ .Files.Get "grafana/draftlab.json" | indent 4 }}
{{- end }}
