# Gateway config (auth keys are sha256 hashes) + raw API keys for clients.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "draftlab.fullname" . }}-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "draftlab.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    listen: "{{ .Values.gateway.config.listen }}"
    ui_dir: /app/web/dist
    retries: {{ .Values.gateway.config.retries }}
    health_check_interval: {{ .Values.gateway.config.healthCheckInterval }}
    breaker:
      failures: {{ .Values.gateway.config.breaker.failures }}
      half_open_after: {{ .Values.gateway.config.breaker.halfOpenAfter }}
    backends:
      - name: engine
        url: http://{{ include "draftlab.fullname" . }}-engine.{{ .Release.Namespace }}.svc:{{ .Values.engine.port }}
        models:
          - {{ .Values.engine.alias }}
      {{- if .Values.vllm.enabled }}
      - name: vllm
        url: http://{{ include "draftlab.fullname" . }}-vllm.{{ .Release.Namespace }}.svc:{{ .Values.vllm.port }}
        models:
          - {{ .Values.vllm.model }}
      {{- end }}
    keys:
      {{- range .Values.gateway.apiKeys }}
      - name: {{ .name }}
        sha256: "{{ .sha256 }}"
        rate: {{ .rate }}
        burst: {{ .burst }}
      {{- end }}
  {{- range .Values.gateway.apiKeys }}
  api-key-{{ .name }}: {{ .key }}
  {{- end }}
