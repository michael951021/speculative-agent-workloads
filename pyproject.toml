[project]
name = "draftlab"
version = "0.1.0"
description = "Speculative decoding measured on this machine's own agent traffic"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
jax = ["jax[cpu]", "flax", "optax", "orbax-checkpoint"]
torch = ["torch>=2.5,<3", "transformers", "safetensors", "peft", "trl", "triton>=3.0"]
data = ["datasets", "polars", "duckdb", "pyarrow"]
serve = ["fastapi", "uvicorn", "httpx", "openai"]
viz = ["matplotlib"]
dev = ["pytest", "ruff", "pyyaml"]
all = [
  "ray[default]",
  "draftlab[jax,torch,data,serve,viz,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draftlab*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["draftlab/tests"]
