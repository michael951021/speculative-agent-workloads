# JAX speculative-decoding engine (OpenAI-compatible, CPU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "speculative-agent-workloads.fullname" . }}-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "speculative-agent-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      {{- include "speculative-agent-workloads.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "speculative-agent-workloads.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
    spec:
      containers:
        - name: engine
          image: "{{ .Values.image.engine.repository }}:{{ .Values.image.engine.tag }}"
          imagePullPolicy: {{ .Values.image.engine.pullPolicy }}
          args:
            - python
            - -m
            - speculative-agent-workloads.serve
            - --model
            - {{ .Values.engine.model }}
            - --alias
            - {{ .Values.engine.alias }}
            - --port
            - {{ .Values.engine.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.engine.port }}
          # No /health on the engine; /v1/models is a cheap GET.
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          env:
            {{- range $k, $v := .Values.engine.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
          {{- with .Values.engine.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: models
          {{- if eq .Values.engine.modelVolume.type "hostPath" }}
          hostPath:
            path: {{ .Values.engine.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.engine.modelVolume.name }}
          {{- end }}
