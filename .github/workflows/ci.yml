name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap toolchain
        run: bash tools/bootstrap.sh
      - name: Import smoke
        run: .venv/bin/python -c "import jax, torch, triton, ray"
      - name: make check
        run: make check
