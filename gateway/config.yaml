# Gateway configuration. API keys are stored as hex sha256 of the raw key.
#   echo -n "sk-..." | sha256sum
listen: ":8200"
ui_dir: "../web/dist"
retries: 1                  # retries on transport (connect) errors
health_check_interval: 5s
breaker:
  failures: 5               # consecutive failures before the breaker opens
  half_open_after: 2s

backends:
  - name: engine
    url: "http://127.0.0.1:8100"   # speculative-agent-workloads engine (python -m speculative_agent_workloads.serve)
    models:
      - "qwen0.5b"
      - "qwen0.5b+ngram-k4"
      - "qwen1.5b"
      - "qwen1.5b+lora-k8"
  # - name: vllm
  #   url: "http://127.0.0.1:8000"
  #   models:
  #     - "Qwen/Qwen2.5-7B-Instruct"

keys:
  - name: dev
    sha256: "e57ba8275edf954332ba434f037f031ed47aa50afc35511ba0f5d48761c3fb5f" # sk-speculative-agent-workloads-dev
    rate: 10            # sustained requests/sec
    burst: 20
