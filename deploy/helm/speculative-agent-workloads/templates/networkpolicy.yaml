{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress/egress for all speculative-agent-workloads pods, then allow the specific
# flows below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "speculative-agent-workloads.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "speculative-agent-workloads.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "speculative-agent-workloads.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Ingress controller (and same-namespace speculative-agent-workloads peers) may reach the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "speculative-agent-workloads.fullname" . }}-gateway-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "speculative-agent-workloads.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "speculative-agent-workloads.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - podSelector:
            matchLabels:
              {{- include "speculative-agent-workloads.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8200
---
# All speculative-agent-workloads pods: DNS plus traffic between speculative-agent-workloads pods (gateway→engine/vllm).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "speculative-agent-workloads.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "speculative-agent-workloads.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "speculative-agent-workloads.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "speculative-agent-workloads.selectorLabels" . | nindent 14 }}
{{- end }}
