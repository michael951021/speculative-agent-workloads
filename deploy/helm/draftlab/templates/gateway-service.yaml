apiVersion: v1
kind: Service
metadata:
  name: {{ include "draftlab.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "draftlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "draftlab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8200
      targetPort: http
